<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sprite restyle — style pack preview</title>
<style>
  :root { --bg: #14101a; --ink: #e8e2d6; --ink-dim: #9a9284; --accent: #e0a33c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; padding: 18px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--accent); }
  .hint { color: var(--ink-dim); font-size: 12px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  select, button, textarea, input { font: inherit; background: #201a2a; color: var(--ink); border: 1px solid #3a3248; border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  textarea { width: 100%; min-height: 160px; font: 12px/1.35 ui-monospace, monospace; resize: vertical; }
  .err { color: #ff7b6b; white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; }
  .ok { color: #8fd47a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .card { background: #1b1624; border: 1px solid #2c2438; border-radius: 8px; padding: 8px; }
  .label { font-size: 12px; color: var(--ink-dim); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  canvas.sheet { image-rendering: pixelated; display: block; margin: 0 auto; background: #241d2f; }
  .pair { display: flex; gap: 8px; justify-content: center; }
  .pair figure { margin: 0; text-align: center; }
  .pair figcaption { font-size: 10px; color: var(--ink-dim); margin-top: 3px; }
  code { background: #201a2a; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./sprite_restyle.js"></script>
</body>
</html>
